<!DOCTYPE html>
<html xmlns="http://www.w3.org./1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/plantilla :: head}">
    <title>TODO supply a title</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
<section th:fragment="botonesAgregar" class="py-4 mb-4 bg-light">
    <div class="container">
        <div class="row">
            <div class="col-md-3">
                <button
                        type="button"
                        class="btn btn-primary btn-block"
                        data-bs-toggle="modal"
                        data-bs-target="#agregarArbol">
                    <i class="fas fa-plus"></i>Agregar Árbol
                </button>
            </div>
        </div>
    </div>
</section>

<section th:fragment="agregarArbol">
    <div id="agregarArbol"
         class="modal fade"
         tabindex="-1"
         aria-labelledby="exampleModalLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">Agregar Árbol</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/arbol/guardar}" th:object="${arbol}"
                      method="POST" class="was-validated" enctype="multipart/form-data">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label>Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required="true"/>
                        </div>
                        <div class="mb-3">
                            <label>Tipo de Flor</label>
                            <input type="text" class="form-control" th:field="*{tipoFlor}" required="true"/>
                        </div>
                        <div class="mb-3">
                            <label>Tiempo de Vida</label>
                            <input type="number" class="form-control" th:field="*{tiempoVida}" required="true"/>
                        </div>
                        <div class="mb-3">
                            <label>Imagen</label>
                            <input type="file" class="form-control" name="imagen" accept="image/*" required="true"/>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-primary" type="submit">Guardar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<section th:fragment="listado">
    <div class="container">
        <div class="row">
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header">
                        <h4>Listado de Arboles</h4>
                    </div>
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                        <tr>
                            <th>Id Árbol</th>
                            <th>Nombre</th>
                            <th>Tipo de Flor</th>
                            <th>Tiempo de Vida</th>
                            <th>Imagen</th>
                            <th>Opciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="arbol : ${arboles}">
                            <td th:text="${arbol.idArbol}"></td>
                            <td th:text="${arbol.nombre}"></td>
                            <td th:text="${arbol.tipoFlor}"></td>
                            <td th:text="${arbol.tiempoVida}"></td>
                            <td>
                                <img th:if="${arbol.rutaImagen != null}" th:src="@{${arbol.rutaImagen}}" alt="Imagen Árbol" style="max-width:100px; max-height:80px;"/>
                                <span th:if="${arbol.rutaImagen == null}">No hay imagen</span>
                            </td>
                            <td>
                                <a th:href="@{/arbol/eliminar/}+${arbol.idArbol}" class="btn btn-danger">
                                    <i class="fas fa-trash"></i>Eliminar
                                </a>
                                <a th:href="@{/arbol/modifica/}+${arbol.idArbol}" class="btn btn-success">
                                    <i class="fas fa-pencil"></i>Actualizar
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>

<section th:fragment="botonesEditar">
    <div class="container py-4 mb-4 bg-light">
        <div class="row">
            <div class="col-md-4 d-grid">
                <a th:href="@{/arbol/listado}" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i> Regresar
                </a>
            </div>
            <div class="col-md-4 d-grid">
                <a th:href="@{/arbol/eliminar/}+${arbol.idArbol}" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Eliminar
                </a>
            </div>
            <div class="col-md-4 d-grid">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-check"></i> Guardar
                </button>
            </div>
        </div>
    </div>
</section>

<section th:fragment="editarArbol">
    <div class="row">
        <div class="col-md-2"></div>
        <div class="col-md-8">
            <form method="POST"
                  th:action="@{/arbol/guardar}"
                  th:object="${arbol}"
                  class="was-validated"
                  enctype="multipart/form-data">
                <input type="hidden" th:field="*{idArbol}"/>
                <input type="hidden" th:field="*{rutaImagen}"/>
                <section th:replace="~{arbol/fragmentos :: botonesEditar}"/>
                <div id="details">
                    <div class="container">
                        <div class="row">
                            <div class="col">
                                <div class="card">
                                    <div class="card-header">
                                        <h4>Actualizar</h4>
                                    </div>
                                    <div class="card-body">
                                        <div class="mb-3">
                                            <label for="nombre">Nombre</label>
                                            <input type="text" class="form-control"
                                                   name="descripcion" th:field="*{nombre}"
                                                   required="true"/>
                                        </div>
                                        <div class="mb-3">
                                            <label for="tipoFlor">Tipo de Flor</label>
                                            <input type="text" class="form-control"
                                                   name="descripcion" th:field="*{tipoFlor}"
                                                   required="true"/>
                                        </div>
                                        <div class="mb-3">
                                            <label for="tiempoVida">Tiempo de Vida</label>
                                            <input type="number" class="form-control"
                                                   name="descripcion" th:field="*{tiempoVida}"
                                                   required="true"/>
                                        </div>
                                        <div class="mb-3">
                                            <label>Imagen</label>
                                            <input type="file" class="form-control" name="imagen" accept="image/*"/>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
